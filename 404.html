<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable | Hugo Challaye</title>
    <meta name="robots" content="noindex">

    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/portfolio/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/portfolio/apple-touch-icon.png">

    <!-- Chemins absolus : GitHub Pages sert cette page pour n'importe quelle
         URL inconnue, y compris /portfolio/un/chemin/profond/ -->
    <!-- La police est désormais servie par le site lui-même : voir la règle
         @font-face en haut de style.css. preload la demande dès la
         première lecture du <head>, sans attendre que le CSS soit
         analysé. L'attribut crossorigin est obligatoire pour les
         polices, même lorsqu'elles viennent du même domaine. -->
    <link rel="preload" href="/portfolio/assets/fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="/portfolio/assets/css/tokens.css">
    <link rel="stylesheet" href="/portfolio/assets/css/style.css">

    <!-- Même thème que le reste du site, appliqué avant l'affichage -->
    <script>
        (function () {
            document.documentElement.classList.add('js');

            var choix = null;
            try {
                choix = localStorage.getItem('theme');
            } catch (e) {
                // localStorage peut être bloqué : on ignore
            }

            var clair = window.matchMedia('(prefers-color-scheme: light)').matches;
            document.documentElement.setAttribute('data-theme', choix || (clair ? 'light' : 'dark'));
        })();
    </script>
</head>
<body>

<main class="erreur">
    <p class="erreur-code">404</p>
    <h1 class="erreur-titre">Cette page<br><span>n'existe pas</span></h1>
    <p class="erreur-texte">
        Le lien est peut-être erroné, ou la page a été déplacée.
        Tu peux revenir à l'accueil pour retrouver mes projets.
    </p>
    <div class="erreur-cta">
        <a href="/portfolio/" class="btn btn-filled">Retour à l'accueil</a>
        <a href="/portfolio/#projets" class="btn btn-ghost">Voir mes projets</a>
    </div>
</main>

</body>
</html>
